apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: checkout-canary-safety
  namespace: releasepilot-lab
spec:
  args:
    - name: candidate-version
  metrics:
    - name: candidate-error-ratio
      interval: 5s
      count: 2
      failureLimit: 0
      inconclusiveLimit: 0
      successCondition: len(result) == 1 && result[0] < 0.2
      failureCondition: len(result) == 1 && result[0] >= 0.2
      provider:
        prometheus:
          address: http://releasepilot-prometheus.releasepilot.svc.cluster.local:9090
          timeout: 3
          query: |
            sum(rate(checkout_requests_total{job="checkout-canary",version="{{args.candidate-version}}",code=~"5.."}[30s]))
            /
            sum(rate(checkout_requests_total{job="checkout-canary",version="{{args.candidate-version}}"}[30s]))
    - name: candidate-latency-p95
      interval: 5s
      count: 2
      failureLimit: 0
      inconclusiveLimit: 0
      successCondition: len(result) == 1 && result[0] < 0.3
      failureCondition: len(result) == 1 && result[0] >= 0.3
      provider:
        prometheus:
          address: http://releasepilot-prometheus.releasepilot.svc.cluster.local:9090
          timeout: 3
          query: |
            histogram_quantile(0.95,
              sum by(le)(rate(checkout_request_duration_seconds_bucket{job="checkout-canary",version="{{args.candidate-version}}"}[30s]))
            )
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: checkout-canary
  namespace: releasepilot-lab
  labels:
    app: checkout-canary
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: checkout-canary
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      stableService: checkout-canary-stable
      canaryService: checkout-canary-preview
      steps:
        - setWeight: 50
        - pause:
            duration: 45s
        - analysis:
            templates:
              - templateName: checkout-canary-safety
            args:
              - name: candidate-version
                valueFrom:
                  fieldRef:
                    fieldPath: spec.template.metadata.labels.version
        - setWeight: 100
  template:
    metadata:
      labels:
        app: checkout-canary
        version: v1
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checkout-api
          image: releasepilot/checkout-api:m1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CHECKOUT_MODE
              value: healthy
            - name: CHECKOUT_VERSION
              value: v1
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-canary
  namespace: releasepilot-lab
spec:
  selector:
    app: checkout-canary
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-canary-stable
  namespace: releasepilot-lab
spec:
  selector:
    app: checkout-canary
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-canary-preview
  namespace: releasepilot-lab
spec:
  selector:
    app: checkout-canary
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
